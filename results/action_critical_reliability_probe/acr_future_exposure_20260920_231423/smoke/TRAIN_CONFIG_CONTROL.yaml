# Generated by fe_train.py. The ONLY field that differs between the two arms is p_pred.
arm: control
p_pred: 1.0                       # 1.0 = 100% H_pred; 0.5 = fixed 50/50
detach_future_feature: true
trainable_module: policy_backend.flow
initial_checkpoint: results/Checkpoints/libero/lawam_libero_sft_release/final_model/pytorch_model.pt
normalization: results/Checkpoints/libero/lawam_libero_sft_release/dataset_statistics.json
use_bf16_cast: false                   # training precision contract (amendment FE-A1)
max_optimizer_updates: 20
validation_every_updates: 10
early_stop_patience_validations: 99
min_delta_relative: 0.0001
optimizer: AdamW
learning_rate: 0.0001
betas: [0.9, 0.95]
eps: 1e-08
weight_decay: 1e-08
gradient_clipping: 1.0
lr_schedule: linear warmup 100 updates then cosine to 5e-07
per_device_batch_size: 2
gradient_accumulation_steps: 4
samples_per_update: 8
repeated_diffusion_steps: 2
n_train_samples: 8000
n_validation_samples: 512
seed: 0
smoke: True
