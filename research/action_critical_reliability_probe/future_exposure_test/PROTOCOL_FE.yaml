# PROTOCOL_FE.yaml — Future Exposure Test
#
# Pre-registered BEFORE any optimizer step and BEFORE any FE measurement exists.
# Written 2026-09-21 to implement the user's locked decisions of this round. It SUPERSEDES
# PROTOCOL_FE_superseded_pretrain_variant.yaml (which initialised from lawam_pretrain and
# recomputed dataset statistics); that file is retained unmodified as a record, not deleted.
#
# AMENDMENTS ARE APPEND-ONLY. See section `amendments` at the end. Nothing above may be
# edited once FE AUDIT 1 passes; changes are expressed as numbered amendments with reasons.

name: future_exposure_test
round: FE
status: frozen_pending_audit1__no_training_started
supersedes: PROTOCOL_FE_superseded_pretrain_variant.yaml

research_question: >-
  If the Flow Action Head is trained with matched ground-truth future features, does
  conditioning on H_gt then beat conditioning on H_pred on held-out demonstrations?
  Operationally: is there a Training Exposure x Future Quality INTERACTION?

why_this_round_exists: >-
  Rounds 1/G2/DS/G3 established that future-prediction error is real, that D x S ranks the
  action-critical future tokens correctly, and that the ranking survives stress. The Headroom
  round then found that repairing that information for one chunk does not change task outcome
  (H-NO-HEADROOM). METHOD_HANDOFF.md named the single unresolved question: is the wall the
  INTERVENTION (a one-chunk oracle future is an inconsistent counterfactual) or the CHANNEL
  (this Flow Head, trained with scheduled sampling OFF, simply cannot use a better future)?
  This round tests the CHANNEL, offline, by training the channel to use it.

scope:
  offline_only: true
  simulator_required: false
  trainable_module: policy_backend.flow
  excluded:
    - simulator_rollouts
    - token_ranking_or_U_D_S_variants
    - new_stress_families
    - method_design
    - any_change_to_prior_rounds

# ---------------------------------------------------------------------------------------
# 0. NAMING HONESTY — locked by user decision
# ---------------------------------------------------------------------------------------
naming:
  round_is_called: adaptation-held-out
  explicitly_not_claimed: >-
    This round does NOT claim the lawam_libero_sft_release checkpoint has never seen these
    demonstrations. It almost certainly has: the released SFT recipe used train_split_all=true
    over all 1693 episodes. The held-out guarantee defined here is narrower and exact: no
    episode in the evaluation splits is used by THIS ROUND's Flow-Head adaptation, in either arm.
  why_this_is_still_a_valid_test: >-
    The endpoint is an INTERACTION between two arms that share the same initialisation and the
    same adaptation data. Any prior exposure of the release checkpoint is common to both arms and
    cancels in the interaction. Absolute loss levels of either checkpoint are NOT the endpoint.
  what_would_invalidate_it: >-
    Only a difference between arms other than the future-condition sampling. Section `fairness`
    enumerates every quantity that must be identical and how it is verified.

# ---------------------------------------------------------------------------------------
# 1. SOURCE — locked by user decision (SFT release, NOT pretrain)
# ---------------------------------------------------------------------------------------
