  checkpoint_total_params: 2555179360
  checkpoint_flow_params: 306405632
  checkpoint_non_flow_params: 2248773728
  base_vlm_weights: results/Checkpoints/qwen3_weights/model.safetensors
  base_vlm_sha256: 7de1838c87a5349b016c26a1c3f7d2bc400a3d485f95ef39a7059ffd734977a0
  deployment_config: results/Checkpoints/libero/lawam_libero_sft_release/config.yaml
  training_config_reference: starVLA/config/training/train_libero.yaml
